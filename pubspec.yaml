flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/HOMEo.png"
  min_sdk_android: 30 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/HOMEo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/HOMEo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/HOMEo.png"

